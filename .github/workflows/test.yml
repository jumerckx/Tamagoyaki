name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # At minute 0 past hour 6. (see https://crontab.guru)
    - cron: "00 06 * * *"

concurrency:
  # A PR number if a pull request, otherwise the commit hash. This
  # cancels queued and in-progress runs for the same PR (presubmit) or
  # commit (postsubmit).
  group: ci-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      # Required by magic-nix-cache-action to talk to the GitHub
      # Actions cache service.
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15

    defaults:
      run:
        # Run every step inside the project's `nix develop` shell so that
        # commands see the exact same toolchain/env as a local checkout.
        shell: nix develop --command bash -e {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # Add the dtz-circt substituter to the system nix.conf as a
          # *trusted* substituter. This both (a) lets CI fetch prebuilt
          # LLVM/MLIR/CIRCT instead of rebuilding them, and (b) silences
          # the "ignoring untrusted flake configuration setting" warning
          # we'd otherwise get from the flake's own `nixConfig`, since
          # the substituter is now accepted at the system level rather
          # than only via the (untrusted) flake.
          extra-conf: |
            extra-substituters = https://dtz-circt.cachix.org
            extra-trusted-public-keys = dtz-circt.cachix.org-1:PHe0okMASm5d9SD+UE0I0wptCy58IK8uNF9P3K7f+IU=
            accept-flake-config = true

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure
        run: tamagoyaki-configure build

      - name: Build and test (check-all)
        run: ninja -C build check-all

      - name: Upload ExternalProject logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: externalproject-logs-${{ matrix.os }}
          path: |
            build/herbie_mlir/rival/deps-build/**/src/*-stamp/*.log
