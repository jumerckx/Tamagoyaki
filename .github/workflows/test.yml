name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # At minute 0 past hour 6. (see https://crontab.guru)
    - cron: "00 06 * * *"

concurrency:
  # A PR number if a pull request, otherwise the commit hash. This
  # cancels queued and in-progress runs for the same PR (presubmit) or
  # commit (postsubmit).
  group: ci-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15

    defaults:
      run:
        # Run every step inside the project's `nix develop` shell so that
        # commands see the exact same toolchain/env as a local checkout.
        shell: nix develop --command bash -e {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # Trust the dtz-circt binary cache so CI fetches the prebuilt
          # LLVM/MLIR/CIRCT store paths instead of rebuilding them
          # (which would take hours). The flake already declares this
          # substituter under `nixConfig`, but `nixConfig` only takes
          # effect for trusted users, so we set it explicitly here too.
          extra-conf: |
            extra-substituters = https://dtz-circt.cachix.org
            extra-trusted-public-keys = dtz-circt.cachix.org-1:PHe0okMASm5d9SD+UE0I0wptCy58IK8uNF9P3K7f+IU=

      - name: Cache /nix/store
        # The substituter above already covers LLVM/MLIR/CIRCT. This
        # cache is mainly there to avoid rebuilding `rival-ffi` (a
        # locally-built Rust derivation) and to skip re-realising the
        # dev-shell closure on every run.
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Trim before saving so the cache stays well under GitHub's
          # 10 GB per-repo budget.
          gc-max-store-size-linux: 5G
          gc-max-store-size-macos: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Realise the dev shell up front so its build/fetch time is
      # attributed to a clearly named step rather than the first
      # `nix develop --command ...` we run below.
      - name: Realise dev shell
        shell: bash
        run: nix develop --command true

      - name: Configure
        run: tamagoyaki-configure build

      - name: Build and test (check-all)
        run: ninja -C build check-all

      - name: Upload ExternalProject logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: externalproject-logs-${{ matrix.os }}
          path: |
            build/herbie_mlir/rival/deps-build/**/src/*-stamp/*.log
