[project]
name = "tamagoyaki"
version = "0.1.0"
requires-python = ">=3.13"
# What it takes to build, test and document Tamagoyaki. The evaluations and the
# tools they call moved out with the case studies:
#   https://github.com/jumerckx/tamagoyaki-case-studies
dependencies = [
    "cmake-format>=0.6.13",
    "lit>=18.1.8",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "breathe>=4.35",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1.0",
    "linkify-it-py>=2.0",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
tamagoyaki = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No Python packages ship from this repository -- herbie_mlir and
# tamagoyaki_eval went with the case studies. The project exists only to pin
# the toolchain that builds and tests Tamagoyaki.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "tamagoyaki",
]
